name: ai-anomalies-detection

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.5.5}
    environment:
      discovery.type: single-node
      # Local development only. Enable TLS/authentication before any shared deployment.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [observability]
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.5.5}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_PORT:-5601}
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [observability]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-9.5.5}
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "127.0.0.1:${LOGSTASH_BEATS_PORT:-5044}:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ${CONTAINER_LOGS_HOST_PATH:-./container-logs}:/var/log/containers:ro
      - logstash_data:/usr/share/logstash/data
    command: ["logstash", "--config.reload.automatic", "--api.http.host", "0.0.0.0"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [observability]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  logstash-management:
    build:
      context: ./ai-anomalies-backend
      dockerfile: logstash_management/Dockerfile
    environment:
      LOGSTASH_CONFIG_TOKEN: ${LOGSTASH_CONFIG_TOKEN:?Set LOGSTASH_CONFIG_TOKEN in .env}
      LOGSTASH_CONFIG_DIRECTORY: /pipeline
      LOGSTASH_API_URL: http://logstash:9600
    ports:
      - "127.0.0.1:${LOGSTASH_CONFIG_API_PORT:-8002}:8002"
    volumes:
      - ./logstash/pipeline:/pipeline
    depends_on:
      logstash:
        condition: service_healthy
    networks: [observability]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  elasticsearch-logs:
    build:
      context: ./ai-anomalies-backend
      dockerfile: elasticsearch_logs/Dockerfile
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_LOGS_INDEX: logs
    ports:
      - "127.0.0.1:${ELASTICSEARCH_LOGS_API_PORT:-8003}:8003"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [observability]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgresql:
    image: postgres:${POSTGRES_VERSION:-18.3}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anomalies}
      POSTGRES_USER: ${POSTGRES_USER:-anomalies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
    networks: [data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  anomaly-detection:
    build:
      context: ./ai-anomalies-backend
      dockerfile: anomaly_detection/Dockerfile
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-anomalies}
      POSTGRES_USER: ${POSTGRES_USER:-anomalies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:///./mlflow.db}
      MLFLOW_ANOMALY_MODEL_NAME: ${MLFLOW_ANOMALY_MODEL_NAME:-log-anomaly-detector}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_ANOMALIES_INDEX: anomalies
    ports:
      - "127.0.0.1:${ANOMALY_API_PORT:-8001}:8001"
    volumes:
      - anomaly_mlflow_data:/mlflow
    working_dir: /mlflow
    command: ["uvicorn", "--app-dir", "/app", "anomaly_detection.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [data, observability]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    networks: [observability]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.34.2}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [observability]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/bin/alertmanager", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.3.1}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [observability]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  observability:
    driver: bridge
  data:
    driver: bridge

volumes:
  elasticsearch_data:
  logstash_data:
  postgresql_data:
  anomaly_mlflow_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
