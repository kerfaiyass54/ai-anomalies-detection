input {
  beats {
    port => 5044
  }
}

filter {
  # Preserve an explicit source_type from the Beat when it is already present.
  if [source_type] not in ["k8s", "docker", "jenkins"] {
    if [kubernetes] or [orchestrator][type] == "kubernetes" or [service][type] == "kubernetes" {
      mutate { replace => { "source_type" => "k8s" } }
    } else if [service][type] == "jenkins" or "jenkins" in [tags] {
      mutate { replace => { "source_type" => "jenkins" } }
    } else if [container] or [docker] or [service][type] == "docker" {
      mutate { replace => { "source_type" => "docker" } }
    } else {
      mutate { add_tag => ["anomaly_source_unmapped"] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }

  if [source_type] in ["k8s", "docker", "jenkins"] and [message] {
    http {
      id => "anomaly_detection_api"
      url => "${ANOMALY_DETECTION_URL}"
      http_method => "post"
      content_type => "application/json"
      format => "json"
      mapping => {
        "message" => "%{[message]}"
        "source_type" => "%{[source_type]}"
        "occurred_at" => "%{@timestamp}"
      }
      request_timeout => 30
      automatic_retries => 2
      retry_failed => true
    }
  }

  stdout { codec => rubydebug }
}
