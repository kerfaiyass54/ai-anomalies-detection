route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname="AnomalyDetected"
      receiver: anomaly-alerts
      group_by: [alertname]
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
  - name: anomaly-alerts
